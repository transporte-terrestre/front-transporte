<div class="min-h-screen flex items-center justify-center bg-background p-4 font-inter-regular text-text">
  <div class="w-full max-w-md bg-background rounded-2xl shadow-lg overflow-hidden border border-text/10">
    <!-- Header -->
    <div class="bg-secondary p-8 text-center relative overflow-hidden">
      <div class="relative z-10 w-20 h-20 bg-background text-error rounded-full flex items-center justify-center mx-auto mb-4 shadow-md text-4xl">
        <i class="fas fa-lock"></i>
      </div>
      <h2 class="relative z-10 text-3xl font-anton tracking-wide text-text mb-1">ACCESO DENEGADO</h2>
    </div>

    <!-- Content -->
    <div class="p-8 text-center space-y-6">
      <div class="space-y-4">
        <p class="text-text/80 font-inter-medium text-lg">
          No tienes los permisos necesarios para realizar esta acción o ver esta página.
        </p>
        <p class="text-text/50 font-inter-regular text-sm">
          Si crees que esto es un error, por favor contacta al administrador del sistema.
        </p>
      </div>

      <!-- Actions -->
      <div class="flex flex-col gap-3 pt-4">
        <button
          (click)="goBack()"
          class="w-full flex justify-center items-center py-3 px-4 rounded-lg shadow-sm text-sm font-inter-bold text-background bg-text hover:bg-text/80 transition-all"
        >
          <i class="fas fa-arrow-left mr-2"></i> Retroceder
        </button>
        
        <button
          (click)="goHome()"
          class="w-full flex justify-center items-center py-3 px-4 border border-text/20 rounded-lg text-sm font-inter-bold text-text hover:bg-text/5 transition-all outline-none"
        >
          <i class="fas fa-home mr-2 text-text/60"></i> Ir al Inicio
        </button>
      </div>
    </div>
  </div>
</div>

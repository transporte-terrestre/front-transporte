<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-anton text-text lowercase">Editar Proveedor</h1>
      <p class="text-sm text-text/60 font-inter-regular mt-1">
        Actualiza la información del proveedor
      </p>
    </div>
    <button
      (click)="onCancel()"
      class="flex items-center gap-2 px-4 py-2 bg-background border border-text/10 text-text rounded-lg text-sm font-inter-medium hover:bg-text/5 transition-all"
    >
      <i class="fas fa-arrow-left text-xs"></i>
      <span>Volver</span>
    </button>
  </div>

  <!-- Form Container -->
  <div class="bg-background border border-text/10 rounded-xl shadow-sm p-0 sm:p-6">
    @if (loading() && !proveedor()) {
    <div class="flex items-center justify-center py-12">
      <div class="flex flex-col items-center gap-3">
        <i class="fas fa-spinner fa-spin text-3xl text-secondary"></i>
        <p class="text-text/60 font-inter-medium">Cargando información...</p>
      </div>
    </div>
    } @else if (proveedor()) {
    <app-proveedor-form
      [proveedor]="proveedor()"
      [editMode]="true"
      (onSubmitForm)="handleFormSubmit($event)"
    />

    <!-- Actions -->
    <div class="flex justify-end gap-3 p-6 sm:p-0 sm:mt-6 sm:pt-6 border-t border-text/10">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 text-text/70 hover:text-text font-inter-medium text-sm transition-colors"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="proveedorFormComponent()?.submitForm()"
        [disabled]="loading()"
        class="px-6 py-2 bg-secondary text-background rounded-lg text-sm font-inter-semibold hover:bg-secondary/90 transition-all shadow-sm hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        @if (loading()) {
        <i class="fas fa-spinner fa-spin"></i>
        }
        <span>Guardar</span>
      </button>
    </div>
    }
  </div>
</div>

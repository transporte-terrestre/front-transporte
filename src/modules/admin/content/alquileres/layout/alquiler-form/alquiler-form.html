<form [formGroup]="form" class="p-4 space-y-4">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <!-- Vehículo -->
    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5"
        >Vehículo <span class="text-danger">*</span></label
      >
      <app-vehiculo-input-search
        formControlName="vehiculoId"
        [class.border-danger]="isFieldInvalid('vehiculoId')"
      />
    </div>

    <!-- Monto -->
    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5">Monto S/.</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text/40 font-inter-medium"
          >S/</span
        >
        <input
          type="number"
          step="0.01"
          formControlName="monto"
          placeholder="0.00"
          class="w-full pl-8 pr-3 py-2 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
          [class.border-danger]="isFieldInvalid('monto')"
        />
      </div>
    </div>

    <!-- Fecha Inicio -->
    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5"
        >Fecha Inicio <span class="text-danger">*</span></label
      >
      <input
        type="date"
        formControlName="fechaInicio"
        class="w-full px-3 py-2 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
        [class.border-danger]="isFieldInvalid('fechaInicio')"
      />
    </div>

    <!-- Fecha Fin -->
    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5">Fecha Fin</label>
      <input
        type="date"
        formControlName="fechaFin"
        class="w-full px-3 py-2 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
        [class.border-danger]="isFieldInvalid('fechaFin')"
      />
    </div>

    <!-- Observaciones -->
    <div class="sm:col-span-2">
      <label class="block text-xs font-inter-semibold text-text mb-1.5">Observaciones</label>
      <textarea
        formControlName="observaciones"
        rows="3"
        placeholder="Detalles del alquiler..."
        class="w-full px-3 py-2 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all resize-none"
        [class.border-danger]="isFieldInvalid('observaciones')"
      ></textarea>
    </div>
  </div>
</form>

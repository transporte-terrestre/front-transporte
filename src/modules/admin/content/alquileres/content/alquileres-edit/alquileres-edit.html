<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-anton text-text lowercase">Editar Alquiler</h1>
      <p class="text-sm text-text/60 font-inter-regular mt-1">
        Modifica los datos del alquiler #{{ alquilerId() }}
      </p>
    </div>
    <button
      (click)="navigateBack()"
      class="flex items-center gap-2 px-4 py-2 bg-background border border-text/10 text-text rounded-lg text-sm font-inter-medium hover:bg-text/5 transition-all"
    >
      <i class="fas fa-arrow-left text-xs"></i>
      <span>Volver</span>
    </button>
  </div>

  @if (loading() && !alquilerData()) {
    <div class="bg-background border border-text/10 rounded-xl shadow-sm">
      <div class="flex items-center justify-center py-12">
        <div class="flex flex-col items-center gap-3">
          <i class="fas fa-spinner fa-spin text-3xl text-secondary"></i>
          <p class="text-text/60 font-inter-medium">Cargando datos del alquiler...</p>
        </div>
      </div>
    </div>
  } @else if (alquilerData()) {
    <div class="bg-background border border-text/10 rounded-xl p-0 sm:p-6 shadow-sm">
      <app-alquiler-form
        #formComponent
        [editMode]="true"
        [initialData]="alquilerData()"
        (onSubmitForm)="handleFormSubmit($any($event))"
      />

      <div class="flex justify-end gap-3 p-6 sm:p-0 sm:mt-6 sm:pt-6 border-t border-text/10">
        <button
          (click)="navigateBack()"
          [disabled]="loading()"
          class="px-4 py-2 text-text/60 hover:text-text hover:bg-text/5 rounded-lg transition-all text-sm font-inter-medium disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cancelar
        </button>
        <button
          (click)="submitForm()"
          [disabled]="loading()"
          class="px-6 py-2 bg-secondary text-background rounded-lg text-sm font-inter-semibold hover:bg-secondary/90 transition-all shadow-sm hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (loading()) {
            <i class="fas fa-spinner fa-spin mr-2"></i>
            Guardando...
          } @else {
            Guardar
          }
        </button>
      </div>
    </div>
  } @else {
    <div
      class="flex flex-col items-center justify-center py-12 bg-background border border-text/10 rounded-xl shadow-sm"
    >
      <div
        class="w-12 h-12 rounded-full bg-danger/10 text-danger flex items-center justify-center mb-3"
      >
        <i class="fas fa-exclamation-triangle text-xl"></i>
      </div>
      <p class="text-text font-inter-semibold text-lg">Alquiler no encontrado</p>
      <p class="text-text/60 font-inter-regular text-sm mt-1">
        El alquiler que intentas editar no existe o fue eliminado.
      </p>
      <button
        (click)="navigateBack()"
        class="mt-4 px-4 py-2 bg-text/5 hover:bg-text/10 text-text rounded-lg text-sm font-inter-medium transition-colors"
      >
        Volver a la lista
      </button>
    </div>
  }
</div>

<div class="space-y-6 max-w-4xl mx-auto">
  <!-- Header -->
  <div class="flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <button
        (click)="navigateBack()"
        class="w-8 h-8 flex items-center justify-center rounded-lg bg-text/5 hover:bg-text/10 text-text/60 hover:text-text transition-all"
        title="Volver atrás"
      >
        <i class="fas fa-arrow-left text-sm"></i>
      </button>
      <div>
        <h1 class="text-2xl font-anton text-text lowercase">Editar Alquiler</h1>
        <p class="text-sm text-text/60 font-inter-regular mt-1">
          Modifica los datos del alquiler #{{ alquilerId() }}
        </p>
      </div>
    </div>
  </div>

  @if (loading() && !alquilerData()) {
    <div
      class="flex flex-col items-center justify-center py-12 bg-background border border-text/10 rounded-xl shadow-sm"
    >
      <i class="fas fa-spinner fa-spin text-3xl text-secondary mb-3"></i>
      <p class="text-text/60 font-inter-medium">Cargando datos del alquiler...</p>
    </div>
  } @else if (alquilerData()) {
    <div class="bg-background border border-text/10 rounded-xl shadow-sm p-6">
      <app-alquiler-form
        #formComponent
        [editMode]="true"
        [initialData]="alquilerData()"
        (onSubmitForm)="handleFormSubmit($any($event))"
      />
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-4 border-t border-text/10">
      <button
        (click)="navigateBack()"
        [disabled]="loading()"
        class="px-5 py-2.5 rounded-lg text-sm font-inter-semibold text-text bg-text/5 hover:bg-text/10 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Cancelar
      </button>
      <button
        (click)="submitForm()"
        [disabled]="loading()"
        class="px-5 py-2.5 rounded-lg text-sm font-inter-semibold text-background bg-secondary hover:bg-secondary/90 transition-all shadow-sm shadow-secondary/20 min-w-[120px] flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (loading()) {
          <i class="fas fa-spinner fa-spin mr-2"></i>
          Guardando...
        } @else {
          <i class="fas fa-save mr-2 text-xs"></i>
          Guardar Cambios
        }
      </button>
    </div>
  } @else {
    <div
      class="flex flex-col items-center justify-center py-12 bg-background border border-text/10 rounded-xl shadow-sm"
    >
      <div
        class="w-12 h-12 rounded-full bg-danger/10 text-danger flex items-center justify-center mb-3"
      >
        <i class="fas fa-exclamation-triangle text-xl"></i>
      </div>
      <p class="text-text font-inter-semibold text-lg">Alquiler no encontrado</p>
      <p class="text-text/60 font-inter-regular text-sm mt-1">
        El alquiler que intentas editar no existe o fue eliminado.
      </p>
      <button
        (click)="navigateBack()"
        class="mt-4 px-4 py-2 bg-text/5 hover:bg-text/10 text-text rounded-lg text-sm font-inter-medium transition-colors"
      >
        Volver a la lista
      </button>
    </div>
  }
</div>

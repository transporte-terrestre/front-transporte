<button
  type="button"
  (click)="openModal($event)"
  class="p-1.5 text-success hover:bg-success/10 rounded-lg transition-colors text-sm"
  title="Terminar Alquiler"
>
  <i class="fas fa-flag-checkered"></i>
</button>

@if (showModal()) {
  <app-modal-form
    class="text-left"
    title="Terminar Alquiler"
    submitText="Confirmar Cierre"
    [maxWidth]="'2xl'"
    [loading]="loading()"
    (onSubmit)="confirmTerminarAlquiler()"
    (onClose)="closeModal()"
  >
    <form [formGroup]="terminarForm" class="p-4 space-y-4 text-left">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-inter-semibold text-text mb-1.5"
            >Fecha Final <span class="text-danger">*</span></label
          >
          <input
            type="date"
            formControlName="fechaFin"
            class="w-full px-3 py-2 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
          />
        </div>

        <div>
          <label class="block text-xs font-inter-semibold text-text mb-1.5"
            >Monto Calculado Final ({{ currencySymbol() }}) <span class="text-danger">*</span></label
          >
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text/40 text-xs font-inter-bold">
              {{ currencySymbol() }}
            </span>
            <input
              type="number"
              step="0.01"
              formControlName="montoTotalFinal"
              class="w-full pl-12 pr-3 py-2 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
            />
          </div>
        </div>

      <div formArrayName="detalles" class="sm:col-span-2 space-y-3 mt-2">
        <label class="block text-xs font-inter-semibold text-text mb-1.5">Kilometraje Final de Unidades <span class="text-danger">*</span></label>
        @for (det of detallesFormArray.controls; track det) {
          <div [formGroupName]="$index" class="flex items-center gap-3 bg-text/5 p-3 rounded-lg border border-text/10">
            <div class="w-10 h-10 rounded-lg bg-secondary/10 flex items-center justify-center text-secondary overflow-hidden shrink-0">
              @if (det.get('foto')?.value) {
                <img [src]="det.get('foto')?.value" alt="Foto Vehículo" class="w-full h-full object-cover" />
              } @else {
                <i class="fas fa-car"></i>
              }
            </div>
            <div class="flex-1">
              <p class="text-[11px] font-inter-bold text-text uppercase">{{ det.get('placa')?.value }}</p>
            </div>
            <div class="w-1/2 relative">
              <input
                type="number"
                step="0.01"
                formControlName="kilometrajeFinal"
                placeholder="Kilometraje"
                class="w-full px-3 py-2 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
                [class.border-danger]="det.get('kilometrajeFinal')?.invalid && det.get('kilometrajeFinal')?.touched"
              />
            </div>
          </div>
        }
      </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-inter-semibold text-text mb-1.5">Observaciones</label>
          <textarea
            formControlName="observaciones"
            rows="2"
            class="w-full px-3 py-2 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all resize-none"
          ></textarea>
        </div>
      </div>

      <div class="pt-2 border-t border-text/10">
        <app-documents-date-upload
          [documents]="[]"
          [label]="'Documentos de Cierre (Adjuntos)'"
          [folder]="'alquileres/documentos'"
          [requireIssueDate]="false"
          [requireExpirationDate]="false"
          (onUpload)="handleDocumentoUpload($event)"
        />

        @if (documentosPendientes().length > 0) {
          <p class="text-[11px] text-text/60 font-inter-medium mt-2">
            Adjuntos listos para guardar: {{ documentosPendientes().length }}
          </p>
        }
      </div>
    </form>
  </app-modal-form>
}

<app-modal-form
  [title]="pasajero() ? 'Editar Pasajero' : 'Nuevo Pasajero'"
  submitText="Guardar"
  cancelText="Cancelar"
  [maxWidth]="'sm'"
  (onSubmit)="submit()"
  (onClose)="cancel()"
>
  <form [formGroup]="form" class="space-y-4 p-4">
    <!-- DNI -->
    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5">DNI</label>
      <input
        type="text"
        formControlName="dni"
        class="w-full px-3 py-2 text-sm bg-text/5 border-2 border-transparent focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
        placeholder="DNI del pasajero"
      />
      @if (form.get('dni')?.touched && form.get('dni')?.errors) {
        <p class="text-danger text-xs font-inter-medium mt-1">El DNI es requerido</p>
      }
    </div>

    <!-- Nombres -->
    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5">Nombres</label>
      <input
        type="text"
        formControlName="nombres"
        class="w-full px-3 py-2 text-sm bg-text/5 border-2 border-transparent focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
        placeholder="Nombres del pasajero"
      />
      @if (form.get('nombres')?.touched && form.get('nombres')?.errors) {
        <p class="text-danger text-xs font-inter-medium mt-1">Los nombres son requeridos</p>
      }
    </div>

    <!-- Apellidos -->
    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5">Apellidos</label>
      <input
        type="text"
        formControlName="apellidos"
        class="w-full px-3 py-2 text-sm bg-text/5 border-2 border-transparent focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
        placeholder="Apellidos del pasajero"
      />
      @if (form.get('apellidos')?.touched && form.get('apellidos')?.errors) {
        <p class="text-danger text-xs font-inter-medium mt-1">Los apellidos son requeridos</p>
      }
    </div>
  </form>
</app-modal-form>

<div class="space-y-3 flex flex-col h-full">
  <div class="flex justify-between items-center h-4">
    <label class="text-xs font-inter-bold text-text uppercase flex items-center gap-2">
      <i class="fas fa-map text-secondary"></i>
      {{ title }}
    </label>
    <span class="text-xs text-text/60 font-inter-regular">
      <i class="fas fa-hand-pointer mr-1"></i> Arrastra los marcadores
    </span>
  </div>

  <div
    class="bg-text/5 rounded-lg border border-text/10 overflow-hidden h-[400px] xl:h-full min-h-[400px] relative z-0 flex-1"
  >
    <div [id]="mapId" class="w-full h-full z-0"></div>
  </div>

  <!-- Distancia y Costo -->
  <div class="grid grid-cols-2 gap-3" [formGroup]="form">
    <div>
      <label class="text-xs font-inter-semibold text-text mb-1 flex items-center gap-2">
        <i class="fas fa-road text-info"></i>
        Distancia (km)
      </label>
      <input
        type="text"
        [formControlName]="distanceControlName"
        readonly
        class="w-full px-3 py-1.5 text-sm bg-text/5 border-2 border-transparent rounded-lg text-text font-inter-semibold outline-none"
        placeholder="0.00"
      />
    </div>

    <div>
      <label class="text-xs font-inter-semibold text-text mb-1 flex items-center gap-2">
        <i class="fas fa-clock text-success"></i>
        Tiempo Estimado (min)
      </label>
      <input
        type="number"
        [formControlName]="timeControlName"
        readonly
        class="w-full px-3 py-1.5 text-sm bg-text/5 border-2 border-transparent rounded-lg text-text font-inter-semibold outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
        placeholder="Minutos"
      />
    </div>
  </div>
</div>

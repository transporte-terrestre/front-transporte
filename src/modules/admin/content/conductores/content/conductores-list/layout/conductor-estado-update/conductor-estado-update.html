<div class="relative w-fit inline-block">
  <button
    type="button"
    (click)="toggleDropdown($event)"
    [disabled]="loading()"
    class="px-3 py-1 text-xs font-inter-semibold rounded-full capitalize flex items-center gap-1.5 transition-all outline-none border border-transparent hover:brightness-95 disabled:opacity-50"
    [ngClass]="getEstadoBadgeClass(estadoActual())"
  >
    @if (loading()) {
      <i class="fas fa-spinner fa-spin text-xs"></i>
    } @else {
      <i [class]="'fas ' + getEstadoIcon(estadoActual())" class="text-xs"></i>
    }
    {{ estadoActual() }}
    <i class="fas fa-chevron-down text-[8px] ml-1 opacity-60"></i>
  </button>

  @if (showDropdown()) {
    <div class="fixed inset-0 z-40" (click)="closeDropdown()"></div>

    <div
      class="fixed w-40 bg-background border border-text/10 rounded-xl shadow-lg z-50 py-2 overflow-hidden animate-fade-in-up"
      [style.top]="dropdownPosition().top"
      [style.left]="dropdownPosition().left"
      [style.transform]="dropdownPosition().transform"
    >
      @for (estado of estados; track estado.value) {
        <button
          type="button"
          (click)="updateEstado(estado.value, $event)"
          class="w-full px-4 py-2 text-left text-xs font-inter-medium hover:bg-text/5 transition-colors flex items-center justify-between group"
          [class.bg-text/5]="estadoActual() === estado.value"
        >
          <div class="flex items-center gap-2">
            <i [class]="'fas ' + estado.icon + ' ' + estado.class"></i>
            <span class="text-text group-hover:text-text/80 capitalize">{{ estado.label }}</span>
          </div>
          @if (estadoActual() === estado.value) {
            <i class="fas fa-check text-success text-[10px]"></i>
          }
        </button>
      }
    </div>
  }
</div>

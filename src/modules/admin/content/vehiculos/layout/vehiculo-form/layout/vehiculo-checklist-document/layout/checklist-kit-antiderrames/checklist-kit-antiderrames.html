@if (items(); as itemList) {
  <div class="space-y-4 text-xs font-inter text-text">
    <div
      class="border border-text/10 rounded-lg overflow-hidden bg-background shadow-sm overflow-x-auto"
    >
      <table class="w-full border-collapse">
        <thead>
          <tr class="bg-info/10 text-info font-inter-bold uppercase text-[10px]">
            <th class="py-2 px-3 text-left border-r border-b border-info/20">DESCRIPCIÓN</th>
            <th class="w-24 py-2 text-center border-b border-info/20">CHECK LIST</th>
          </tr>
        </thead>
        <tbody>
          @for (item of itemList; track item.key) {
            <tr class="hover:bg-text/2 transition-colors">
              <td
                class="px-3 py-2 border-r border-b border-text/10 leading-tight font-inter-medium"
              >
                {{ item.value.label }}
              </td>

              <!-- Check List -->
              <td class="text-center border-b border-text/10 bg-success/5">
                @if (item.value.estado) {
                  <i class="fas fa-check text-success text-sm"></i>
                } @else {
                  <i class="fas fa-times text-danger text-sm"></i>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div
      class="border border-text/10 rounded-lg p-3 bg-background shadow-sm flex items-center gap-2"
    >
      <span class="font-inter-bold uppercase text-[10px] text-text/60">UBICACIÓN STE:</span>
      <span class="font-inter-medium text-text">{{ ubicacion() || '-' }}</span>
    </div>
  </div>
} @else {
  <div class="p-8 text-center text-text/40">
    <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
    <p>Cargando datos...</p>
  </div>
}

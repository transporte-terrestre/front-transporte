@if (data(); as item) {
  @if (item.document.photo.url) {
    <div class="flex flex-col items-center justify-center h-full gap-4">
      <img
        [src]="item.document.photo.url"
        alt="Checklist IPERC Continuo"
        class="w-full h-auto max-h-[70vh] object-contain rounded-lg"
      />
      <div class="flex flex-col items-center gap-1">
        <span
          class="px-2 py-1 rounded bg-secondary/10 text-secondary text-xs font-inter-bold uppercase tracking-wider"
        >
          {{ item.viajeTipo }}
        </span>
        <span class="text-[10px] text-text/40 font-inter-medium">
          {{ item.version }}
        </span>
      </div>
    </div>
  } @else {
    <div
      class="flex flex-col items-center justify-center h-64 p-8 text-center text-text/40 bg-text/5 rounded-lg border border-dashed border-text/10"
    >
      <i class="fas fa-image text-4xl mb-3 opacity-50"></i>
      <p class="text-sm font-inter-medium">No hay imagen disponible para este checklist.</p>
    </div>
  }
}

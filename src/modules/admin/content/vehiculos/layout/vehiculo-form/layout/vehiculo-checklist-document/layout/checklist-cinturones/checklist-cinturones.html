@if (data()) {
  <ng-template #tableTpl let-items="items">
    <div
      class="border border-text/10 rounded-lg overflow-hidden bg-background shadow-sm text-xs font-inter text-text h-full"
    >
      <table class="w-full border-collapse">
        <thead>
          <tr class="bg-info/10 text-info font-inter-bold uppercase text-[10px]">
            <th rowspan="2" class="py-2 px-3 text-left border-r border-b border-info/20">
              N° ASIENTO
            </th>
            <th
              colspan="2"
              class="py-1 px-1 text-center border-r border-b border-info/20 w-[100px]"
            >
              ESTADO
            </th>
            <th rowspan="2" class="py-2 px-3 text-center border-b border-info/20 w-1/3">
              OBSERVACIÓN / Acción Correctiva
            </th>
          </tr>
          <tr class="bg-info/10 text-info font-inter-bold uppercase text-[10px]">
            <th class="w-[50px] py-1 text-center border-r border-b border-info/20">OK</th>
            <th class="w-[50px] py-1 text-center border-r border-b border-info/20">MAL</th>
          </tr>
        </thead>
        <tbody>
          @for (item of items; track item.key) {
            <tr class="hover:bg-text/2 transition-colors">
              <td class="px-3 py-2 border-r border-b border-text/10 leading-tight">
                {{ item.value.label }}
              </td>
              <!-- OK -->
              <td class="text-center border-r border-b border-text/10 bg-success/5">
                @if (item.value.habilitado) {
                  <i class="fas fa-check text-success text-sm"></i>
                }
              </td>
              <!-- MAL -->
              <td class="text-center border-r border-b border-text/10 bg-danger/5">
                @if (!item.value.habilitado) {
                  <i class="fas fa-times text-danger text-sm"></i>
                }
              </td>
              <!-- Obs -->
              <td
                class="px-3 py-2 border-b border-text/10 text-[10px] italic text-text/70 wrap-break-word"
              >
                {{ item.value.observacion }}
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </ng-template>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
    <ng-container *ngTemplateOutlet="tableTpl; context: { items: col1 }"></ng-container>
    <ng-container *ngTemplateOutlet="tableTpl; context: { items: col2 }"></ng-container>
  </div>
} @else {
  <div class="p-8 text-center text-text/40">
    <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
    <p>Cargando datos...</p>
  </div>
}

<div
  class="fixed inset-0 z-60 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fade-in"
>
  <div
    class="bg-background w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-text/10"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 py-4 border-b border-text/10 flex justify-between items-center bg-text/5">
      <h3 class="text-lg font-anton text-text lowercase">Comentario Rápido</h3>
      <button type="button" (click)="closeAddComentario()" class="text-text/40 hover:text-text">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <form [formGroup]="addComentarioForm" (ngSubmit)="saveComentario($event)" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-inter-medium text-text mb-2">Tipo</label>
        <div class="relative">
          <select
            formControlName="tipo"
            class="w-full px-3 py-2 text-sm bg-text/5 border-2 border-transparent focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all appearance-none cursor-pointer"
          >
            <option value="general">General</option>
            <option value="novedad">Novedad</option>
            <option value="incidencia">Incidencia</option>
            <option value="observacion">Observación</option>
          </select>
          <span
            class="absolute inset-y-0 right-3 flex items-center text-text/60 pointer-events-none"
          >
            <i class="fas fa-chevron-down text-xs"></i>
          </span>
        </div>
      </div>
      <div>
        <label class="block text-xs font-inter-medium text-text mb-2">Comentario</label>
        <textarea
          formControlName="comentario"
          rows="4"
          class="w-full px-3 py-2 text-sm bg-text/5 border-2 border-transparent focus:border-secondary rounded-lg text-text outline-none placeholder:text-text/40 resize-none"
          placeholder="Escribe el comentario aquí..."
        ></textarea>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="closeAddComentario()"
          class="px-4 py-2 text-sm font-inter-medium text-text/60 hover:text-text transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="addComentarioForm.invalid || loading()"
          class="px-4 py-2 bg-secondary text-background text-sm font-inter-bold rounded-lg hover:bg-secondary/90 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-sm hover:shadow-md"
        >
          @if (loading()) {
            <i class="fas fa-spinner fa-spin mr-2"></i> Guardando...
          } @else {
            Guardar
          }
        </button>
      </div>
    </form>
  </div>
</div>

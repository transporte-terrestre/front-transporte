<button
  type="button"
  (click)="toggleMapOcasional()"
  [class.bg-success]="showMapOcasional"
  [class.text-white]="showMapOcasional"
  [class.border-success]="showMapOcasional"
  class="flex items-center justify-center gap-2 px-3 py-1.5 text-[11px] font-inter-semibold rounded-md border border-text/10 bg-text/5 text-text/80 hover:bg-success hover:text-white hover:border-success transition-all w-full"
>
  <i class="fas fa-map-marked-alt"></i>
  Marcar en Mapa
</button>

@if (showMapOcasional) {
  <div class="mt-2 p-3 bg-text/5 border border-dashed border-text/10 rounded-xl relative" [formGroup]="form">
    <div class="flex flex-col sm:flex-row gap-2 mb-3">
      <div class="flex-1 relative">
        <label class="text-[9px] font-inter-bold text-text/50 uppercase tracking-wider block mb-1">Latitud</label>
        <input
          type="number"
          #latInput
          [value]="form.get('metadata')?.value?.puntoPartida?.lat ?? ''"
          (input)="updateMapCoordsFromInputs(latInput.value, lngInput.value)"
          class="w-full px-2 py-1 text-xs bg-background border border-text/10 rounded-md text-text font-inter-medium outline-none focus:border-success transition-all"
          placeholder="Ej: -12.0463"
        />
      </div>
      <div class="flex-1 relative">
        <label class="text-[9px] font-inter-bold text-text/50 uppercase tracking-wider block mb-1">Longitud</label>
        <input
          type="number"
          #lngInput
          [value]="form.get('metadata')?.value?.puntoPartida?.lng ?? ''"
          (input)="updateMapCoordsFromInputs(latInput.value, lngInput.value)"
          class="w-full px-2 py-1 text-xs bg-background border border-text/10 rounded-md text-text font-inter-medium outline-none focus:border-success transition-all"
          placeholder="Ej: -77.0427"
        />
      </div>
    </div>
    <div
      #mapElement
      class="w-full h-40 rounded-lg overflow-hidden border border-text/10 relative z-10 shadow-inner"
    ></div>
  </div>
}

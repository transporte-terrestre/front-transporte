<app-modal-form
  title="Editar Registro"
  submitText="Actualizar"
  [loading]="isSubmitting"
  maxWidth="xl"
  (onSubmit)="save()"
  (onClose)="close()"
>
  <form [formGroup]="form" class="p-5 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- Mapa de Edición -->
      @if (!esDescanso) {
        <div class="md:col-span-2 space-y-3">
          <div class="space-y-1.5">
            <label class="text-[10px] font-inter-bold text-text/50 uppercase tracking-wider">
              Ubicación en el Mapa (puedes arrastrar el marcador)
            </label>
            <div class="h-44 w-full rounded-2xl border border-text/10 overflow-hidden relative">
              <div id="edit-tramo-map" class="w-full h-full"></div>
            </div>
          </div>

          <!-- Coordenadas -->
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label class="text-[9px] font-inter-bold text-text/40 uppercase tracking-wider"
                >Latitud</label
              >
              <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i
                    class="fas fa-globe-americas text-text/20 group-focus-within:text-secondary"
                  ></i>
                </div>
                <input
                  type="number"
                  step="any"
                  formControlName="latitud"
                  class="w-full pl-9 pr-3 py-1.5 text-xs bg-background border border-text/10 focus:border-secondary rounded-xl outline-none transition-all font-inter-medium"
                />
              </div>
            </div>
            <div class="space-y-1.5">
              <label class="text-[9px] font-inter-bold text-text/40 uppercase tracking-wider"
                >Longitud</label
              >
              <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i
                    class="fas fa-globe-americas text-text/20 group-focus-within:text-secondary"
                  ></i>
                </div>
                <input
                  type="number"
                  step="any"
                  formControlName="longitud"
                  class="w-full pl-9 pr-3 py-1.5 text-xs bg-background border border-text/10 focus:border-secondary rounded-xl outline-none transition-all font-inter-medium"
                />
              </div>
            </div>
          </div>
        </div>
      }

      <!-- Tipo de Punto -->
      <div class="md:col-span-2 space-y-1.5">
        <label class="text-[10px] font-inter-bold text-text/50 uppercase tracking-wider">
          Tipo de Registro *
        </label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-tag text-text/20 group-focus-within:text-secondary"></i>
          </div>
          <select
            formControlName="tipo"
            class="w-full pl-9 pr-3 py-2 text-xs bg-background border border-text/10 focus:border-secondary rounded-xl outline-none appearance-none transition-all font-inter-medium"
            [class.bg-text/5]="esDescanso"
          >
            <option value="origen">Salida (Origen)</option>
            <option value="destino">Llegada (Destino)</option>
            <option value="parada">Parada Ocasional</option>
            <option value="punto">Punto de Ruta</option>
          </select>
          <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
            <i class="fas fa-chevron-down text-[10px] text-text/20"></i>
          </div>
        </div>
      </div>

      <!-- Nombre del Lugar -->
      @if (!esDescanso) {
        <div class="md:col-span-2 space-y-1.5">
          <label class="text-[10px] font-inter-bold text-text/50 uppercase tracking-wider">
            Nombre del Lugar *
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-map-marker-alt text-text/20 group-focus-within:text-secondary"></i>
            </div>
            <input
              type="text"
              formControlName="nombreLugar"
              placeholder="Ej. Grifo, Restaurante, etc."
              class="w-full pl-9 pr-3 py-2 text-xs bg-background border border-text/10 focus:border-secondary rounded-xl outline-none transition-all font-inter-medium"
            />
          </div>
        </div>
      }

      <!-- Fecha y Hora -->
      <div class="md:col-span-2 space-y-1.5">
        <label class="text-[10px] font-inter-bold text-text/50 uppercase tracking-wider">
          Fecha y Hora *
        </label>
        <div class="bg-text/2 border border-text/5 rounded-2xl p-3 grid grid-cols-2 gap-3">
          <div class="flex items-center gap-2">
            <label class="text-[9px] font-inter-bold text-text/40">F.</label>
            <input
              type="date"
              formControlName="fecha"
              class="w-full px-2 py-1 text-[11px] bg-background border border-text/10 rounded-lg outline-none transition-all"
            />
          </div>
          <div class="flex items-center gap-2">
            <label class="text-[9px] font-inter-bold text-text/40">H.</label>
            <input
              type="time"
              formControlName="hora"
              class="w-full px-2 py-1 text-[11px] bg-background border border-text/10 rounded-lg outline-none transition-all"
            />
          </div>
        </div>
      </div>

      <!-- Kilometraje -->
      @if (!esDescanso) {
        <div class="md:col-span-2 space-y-1.5">
          <label class="text-[10px] font-inter-bold text-text/50 uppercase tracking-wider">Kilometraje *</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-tachometer-alt text-text/20 group-focus-within:text-secondary"></i>
            </div>
            <input
              type="number"
              formControlName="kilometrajeFinal"
              class="w-full pl-9 pr-3 py-2 text-xs bg-background border border-text/10 focus:border-secondary rounded-xl outline-none transition-all font-inter-medium"
              placeholder="0"
            />
          </div>
        </div>
      }
    </div>
  </form>
</app-modal-form>

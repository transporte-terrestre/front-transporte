<div class="space-y-3">
  <div class="flex items-center justify-between">
    <label class="text-sm font-inter-bold text-text flex items-center gap-2">
      <i class="fas fa-users-cog text-info"></i>
      Conductores Asignados
    </label>
    <button
      type="button"
      (click)="openAddConductor()"
      class="text-xs bg-secondary/10 text-secondary px-3 py-1.5 rounded-lg font-inter-semibold hover:bg-secondary/20 transition-all"
    >
      + Agregar Conductor
    </button>
  </div>

  <div class="grid grid-cols-1 gap-2">
    @for (c of viaje().conductores; track c.id) {
    <div
      class="flex items-center justify-between bg-background border border-text/10 px-4 py-3 rounded-xl hover:border-text/20 transition-all"
    >
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-text/5 flex items-center justify-center text-text/60">
          <i class="fas fa-user text-xs"></i>
        </div>
        <div class="flex flex-col">
          <span class="text-sm font-inter-semibold text-text flex items-center gap-2">
            {{ c.nombreCompleto }}
            @if (c.esPrincipal) {
            <span
              class="text-[10px] bg-secondary text-background px-2 py-0.5 rounded-full uppercase tracking-wider"
              >Principal</span
            >
            }
          </span>
          <span class="text-xs text-text/60 capitalize">Rol: {{ c.rol }}</span>
        </div>
      </div>
      <button
        type="button"
        (click)="removeConductor(c.id)"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-text/40 hover:text-danger hover:bg-danger/10 transition-all"
        title="Quitar conductor"
      >
        <i class="fas fa-trash-alt text-xs"></i>
      </button>
    </div>
    } @if (!viaje().conductores?.length) {
    <p class="text-xs text-text/40 italic py-2 text-center">No hay conductores asignados.</p>
    }
  </div>
</div>

<!-- Add Conductor Modal -->
@if (showConductorModal()) {
<div
  class="fixed inset-0 z-60 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fade-in"
>
  <div
    class="bg-background w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-text/10"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 py-4 border-b border-text/10 flex justify-between items-center bg-text/5">
      <h3 class="text-lg font-anton text-text lowercase">Asignar Conductor</h3>
      <button type="button" (click)="closeAddConductor()" class="text-text/40 hover:text-text">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <form [formGroup]="addConductorForm" (ngSubmit)="saveConductor()" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-inter-medium text-text mb-2">Buscar Conductor</label>
        <app-conductor-input-search formControlName="conductorId" />
      </div>
      <div>
        <label class="block text-xs font-inter-medium text-text mb-2">Rol</label>
        <div class="relative">
          <select
            formControlName="rol"
            class="w-full px-3 py-2 text-sm bg-text/5 border-2 border-transparent focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all appearance-none cursor-pointer"
          >
            <option value="conductor">Conductor</option>
            <option value="copiloto">Copiloto</option>
            <option value="auxiliar">Auxiliar</option>
          </select>
          <span
            class="absolute inset-y-0 right-3 flex items-center text-text/60 pointer-events-none"
          >
            <i class="fas fa-chevron-down text-xs"></i>
          </span>
        </div>
      </div>
      <label
        class="flex items-center gap-3 p-3 rounded-lg border border-text/10 cursor-pointer hover:bg-text/5"
      >
        <input
          type="checkbox"
          formControlName="esPrincipal"
          class="w-4 h-4 text-secondary accent-secondary rounded"
        />
        <span class="text-sm font-inter-medium text-text">Marcar como Principal</span>
      </label>
      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="closeAddConductor()"
          class="px-4 py-2 text-sm font-inter-medium text-text/60 hover:text-text"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="addConductorForm.invalid"
          class="px-4 py-2 bg-secondary text-background text-sm font-inter-bold rounded-lg hover:bg-secondary/90 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
}

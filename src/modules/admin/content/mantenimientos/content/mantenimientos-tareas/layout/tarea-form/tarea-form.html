<div class="space-y-4">
  <!-- Código -->
  <div>
    <label class="block text-xs font-inter-semibold text-text mb-2">
      Código <span class="text-danger">*</span>
    </label>
    <input
      type="text"
      [formControl]="$any(tareaForm.controls['codigo'])"
      class="w-full px-3 py-2.5 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
      placeholder="Ej: T-001"
    />
    @if (tareaForm.get('codigo')?.touched && tareaForm.get('codigo')?.errors) {
    <p class="text-danger text-xs font-inter-medium mt-1">El código es requerido</p>
    }
  </div>

  <!-- Descripción -->
  <div>
    <label class="block text-xs font-inter-semibold text-text mb-2">
      Descripción <span class="text-danger">*</span>
    </label>
    <textarea
      [formControl]="$any(tareaForm.controls['descripcion'])"
      rows="3"
      class="w-full px-3 py-2.5 text-sm bg-background border-2 border-text/10 focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all resize-none"
      placeholder="Describe la tarea de mantenimiento..."
    ></textarea>
    @if (tareaForm.get('descripcion')?.touched && tareaForm.get('descripcion')?.errors) {
    <p class="text-danger text-xs font-inter-medium mt-1">La descripción es requerida</p>
    }
  </div>
</div>

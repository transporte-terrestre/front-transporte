<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-anton text-text lowercase">Editar Mantenimiento</h1>
      <p class="text-sm text-text/60 font-inter-regular mt-1">
        Actualiza la información del mantenimiento
      </p>
    </div>
    <div class="flex items-center gap-3">
      <button
        (click)="downloadOrdenServicio()"
        class="flex items-center gap-2 px-4 py-2 bg-text/5 text-text rounded-lg text-sm font-inter-medium hover:bg-text/10 transition-all border border-text/10"
        title="Descargar Orden de Servicio"
      >
        <i class="fas fa-file-pdf text-danger"></i>
        <span>Orden de Servicio</span>
      </button>
      <button
        (click)="onCancel()"
        class="flex items-center gap-2 px-4 py-2 bg-background border border-text/10 text-text rounded-lg text-sm font-inter-medium hover:bg-text/5 transition-all"
      >
        <i class="fas fa-arrow-left text-xs"></i>
        <span>Volver</span>
      </button>
    </div>
  </div>

  <div class="bg-background border border-text/10 rounded-xl p-0 sm:p-6 shadow-sm">
    @if (loading()) {
    <div class="flex items-center justify-center py-12">
      <div class="flex flex-col items-center gap-3">
        <i class="fas fa-spinner fa-spin text-3xl text-secondary"></i>
        <p class="text-text/60 font-inter-medium">Cargando información...</p>
      </div>
    </div>
    } @else if (mantenimiento()) {
    <app-mantenimiento-form
      [mantenimiento]="mantenimiento()"
      [editMode]="true"
      (onSubmitForm)="handleFormSubmit($event)"
      (onDataChange)="handleDataChange()"
    />

    <div class="flex justify-end gap-3 p-6 sm:p-0 sm:mt-6 sm:pt-6 border-t border-text/10">
      <button
        (click)="onCancel()"
        class="px-4 py-2 text-text/60 hover:text-text hover:bg-text/5 rounded-lg transition-all text-sm font-inter-medium"
      >
        Cancelar
      </button>
      <button
        (click)="mantenimientoFormComponent()?.submitForm()"
        class="px-6 py-2 bg-secondary text-background rounded-lg text-sm font-inter-semibold hover:bg-secondary/90 transition-all shadow-sm hover:shadow-md"
      >
        Guardar
      </button>
    </div>
    }
  </div>
</div>

@if (showSignatureModal()) {
  <app-user-signature-select-modal
    (onSelected)="handleSignatureSelected($event)"
    (onClose)="handleSignatureClose()"
  />
}

<form class="p-4 space-y-4">
  <div>
    <label class="block text-xs font-inter-semibold text-text mb-1.5">Vehículo</label>
    <app-vehiculo-input-search
      [ngModel]="selectedVehiculo()"
      (ngModelChange)="onVehiculoChange($event)"
      [showClear]="true"
      name="vehiculo"
      class="block w-full"
    />
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-60">
    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5">Combustible</label>
      <div class="relative">
        <select
          [ngModel]="form().combustible"
          (ngModelChange)="updateForm('combustible', $event)"
          name="combustible"
          class="w-full px-3 py-2 text-sm bg-text/5 border-2 border-transparent focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all appearance-none cursor-pointer"
        >
          <option value="">Seleccionar...</option>
          @for (option of combustibleOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <span class="absolute inset-y-0 right-3 flex items-center text-text/60 pointer-events-none">
          <i class="fas fa-chevron-down text-xs"></i>
        </span>
      </div>
    </div>

    <div>
      <label class="block text-xs font-inter-semibold text-text mb-1.5">Galones</label>
      <input
        type="number"
        min="0.01"
        step="0.01"
        [ngModel]="form().galonesEstablecidos"
        (ngModelChange)="updateForm('galonesEstablecidos', $event)"
        name="galonesEstablecidos"
        class="w-full px-3 py-2 text-sm bg-text/5 border-2 border-transparent focus:border-secondary rounded-lg text-text font-inter-regular outline-none transition-all"
        placeholder="0.00"
      />
    </div>
  </div>
</form>

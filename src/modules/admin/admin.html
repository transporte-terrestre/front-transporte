<div class="flex h-screen w-full bg-background text-text overflow-hidden font-inter-regular">
  <app-sidebar
    [class.md:w-64]="!sidebarCollapsed()"
    [class.md:w-20]="sidebarCollapsed()"
    class="md:flex md:flex-col shrink-0 md:border-r md:border-text/10 md:bg-background z-20 transition-all duration-300"
    [isOpen]="sidebarOpen()"
    [isCollapsed]="sidebarCollapsed()"
    (close)="closeSidebar()"
  />

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
    <app-navbar
      class="h-16 shrink-0 border-b border-text/10 bg-background z-10"
      (toggleSidebar)="toggleSidebar()"
      (toggleCollapse)="toggleCollapse()"
    />

    <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-background relative scroll-smooth">
      <div class="max-w-7xl mx-auto w-full">
        <router-outlet />
      </div>
    </main>
  </div>
  <app-notificaciones />
</div>

<div class="space-y-2">
  <label class="block text-xs font-inter-semibold text-text">
    {{ label() }}
    <span class="text-text/50 font-inter-regular">({{ documentsList().length }}/{{ maxDocuments() }})</span>
  </label>

  <!-- Lista de documentos -->
  @if (documentsList().length > 0) {
    <div class="space-y-2">
      @for (doc of documentsList(); track doc.url; let i = $index) {
        <div class="flex items-center gap-3 p-3 rounded-lg border border-text/10 bg-text/5 group hover:border-text/20 transition-colors">
          <!-- Icono del documento -->
          <div
            class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0"
            [ngClass]="getDocumentBgColor(doc.type)"
          >
            <i
              class="fas text-lg"
              [ngClass]="[getDocumentIcon(doc.type), getDocumentColor(doc.type)]"
            ></i>
          </div>

          <!-- Info del documento -->
          <div class="flex-1 min-w-0">
            <p class="text-sm font-inter-medium text-text truncate">{{ doc.name }}</p>
            <p class="text-xs text-text/50 font-inter-regular uppercase">{{ doc.type }}</p>
          </div>

          <!-- Acciones -->
          <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
            <button
              type="button"
              (click)="openDocument(doc.url)"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-text/50 hover:bg-secondary/10 hover:text-secondary transition-colors"
              title="Ver documento"
            >
              <i class="fas fa-external-link-alt text-xs"></i>
            </button>
            <button
              type="button"
              (click)="removeDocument(i)"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-text/50 hover:bg-danger/10 hover:text-danger transition-colors"
              title="Eliminar"
            >
              <i class="fas fa-trash text-xs"></i>
            </button>
          </div>
        </div>
      }
    </div>
  }

  <!-- Dropzone -->
  @if (canAddMore()) {
    <div
      class="relative border border-dashed rounded-lg px-4 py-2 text-center transition-colors cursor-pointer"
      [class.border-text/30]="!dragOver()"
      [class.bg-text/5]="!dragOver()"
      [class.border-secondary]="dragOver()"
      [class.bg-secondary/10]="dragOver()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      (click)="fileInput.click()"
    >
      <input
        #fileInput
        type="file"
        accept=".pdf,.doc,.docx,.xls,.xlsx"
        multiple
        class="hidden"
        (change)="onFileSelect($event)"
      />

      @if (uploading()) {
        <div class="flex items-center justify-center gap-2">
          <div class="w-4 h-4 border-2 border-text/30 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-xs text-text/50 font-inter-medium">Subiendo...</p>
        </div>
      } @else {
        <div class="flex items-center justify-center gap-2">
          <i class="fas fa-file-upload text-text/40"></i>
          <p class="text-xs text-text/50 font-inter-medium">
            Arrastra o <span class="text-text/70">selecciona documentos</span>
          </p>
        </div>
      }
    </div>
  }
</div>

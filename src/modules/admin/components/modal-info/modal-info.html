<div
  class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
  (click)="handleClose()"
>
  <div
    class="bg-background rounded-xl shadow-2xl w-full flex flex-col max-h-[90vh]"
    [ngClass]="getMaxWidthClass()"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-text/10 shrink-0">
      <h2 class="text-lg font-inter-bold text-text truncate">{{ title() }}</h2>
      <button
        type="button"
        (click)="handleClose()"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-text/50 hover:bg-text/5 hover:text-text transition-colors"
        title="Cerrar"
      >
        <i class="fas fa-times text-sm"></i>
      </button>
    </div>

    <!-- Body (Scrollable) -->
    <div class="overflow-y-auto flex-1 flex items-center justify-center p-4">
      <ng-content></ng-content>
    </div>
  </div>
</div>

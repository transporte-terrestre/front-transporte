<div class="space-y-2">
  <label class="block text-xs font-inter-semibold text-text">
    {{ label() }}
    <span class="text-text/50 font-inter-regular">({{ imagesList().length }}/{{ maxImages() }})</span>
  </label>

  <!-- Grid de imágenes -->
  @if (imagesList().length > 0) {
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
      @for (image of imagesList(); track image; let i = $index) {
        <div class="relative group aspect-square rounded-lg overflow-hidden bg-text/5">
          <img
            [src]="image"
            alt="Imagen {{ i + 1 }}"
            class="w-full h-full object-cover"
          />
          <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
            <button
              type="button"
              (click)="removeImage(i)"
              class="w-8 h-8 bg-danger rounded-full flex items-center justify-center text-white hover:bg-danger/80 transition-colors"
            >
              <i class="fas fa-trash text-xs"></i>
            </button>
          </div>
        </div>
      }
    </div>
  }

  <!-- Dropzone -->
  @if (canAddMore()) {
    <div
      class="relative border border-dashed rounded-lg px-4 py-2 text-center transition-colors cursor-pointer"
      [class.border-text/30]="!dragOver()"
      [class.bg-text/5]="!dragOver()"
      [class.border-secondary]="dragOver()"
      [class.bg-secondary/10]="dragOver()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      (click)="fileInput.click()"
    >
      <input
        #fileInput
        type="file"
        accept="image/*"
        multiple
        class="hidden"
        (change)="onFileSelect($event)"
      />

      @if (uploading()) {
        <div class="flex items-center justify-center gap-2">
          <div class="w-4 h-4 border-2 border-text/30 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-xs text-text/50 font-inter-medium">Subiendo...</p>
        </div>
      } @else {
        <div class="flex items-center justify-center gap-2">
          <i class="fas fa-cloud-upload-alt text-text/40"></i>
          <p class="text-xs text-text/50 font-inter-medium">
            Arrastra o <span class="text-text/70">selecciona imágenes</span>
          </p>
        </div>
      }
    </div>
  }
</div>

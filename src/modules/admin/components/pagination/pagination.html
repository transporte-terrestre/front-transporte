<div class="flex items-center justify-between px-4 py-3 bg-background border-t border-text/10">
  <!-- Info de paginación -->
  <div class="flex items-center gap-4">
    <p class="text-xs text-text/60 font-inter-regular">
      Mostrando <span class="font-inter-semibold">{{ getStartItem() }}</span> a
      <span class="font-inter-semibold">{{ getEndItem() }}</span> de
      <span class="font-inter-semibold">{{ meta()?.total || 0 }}</span> resultados
    </p>

    <!-- Selector de tamaño de página -->
    <div class="flex items-center gap-2">
      <label class="text-xs text-text/60 font-inter-regular">Por página:</label>
      <select
        [value]="pageSize()"
        (change)="onPageSizeChange($event)"
        class="px-2 py-1 text-xs bg-background border border-text/10 rounded text-text font-inter-medium outline-none focus:border-secondary transition-colors"
      >
        <option [value]="10">10</option>
        <option [value]="20">20</option>
        <option [value]="30">30</option>
        <option [value]="50">50</option>
      </select>
    </div>
  </div>

  <!-- Controles de paginación -->
  <div class="flex items-center gap-2">
    <!-- Botón Primera página -->
    <button
      [disabled]="!meta()?.hasPreviousPage"
      (click)="goToPage(1)"
      class="px-2 py-1 text-xs rounded text-text/60 hover:text-text hover:bg-text/5 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
      title="Primera página"
    >
      <i class="fas fa-angle-double-left"></i>
    </button>

    <!-- Botón Anterior -->
    <button
      [disabled]="!meta()?.hasPreviousPage"
      (click)="goToPage(currentPage() - 1)"
      class="px-2 py-1 text-xs rounded text-text/60 hover:text-text hover:bg-text/5 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
      title="Página anterior"
    >
      <i class="fas fa-angle-left"></i>
    </button>

    <!-- Páginas -->
    <div class="flex items-center gap-1">
      @for (page of getPageNumbers(); track page) {
        @if (page === '...') {
          <span class="px-2 py-1 text-xs text-text/40">...</span>
        } @else {
          <button
            (click)="goToPage(+page)"
            [class]="currentPage() === +page
              ? 'px-3 py-1 text-xs rounded bg-secondary text-background font-inter-semibold'
              : 'px-3 py-1 text-xs rounded text-text/60 hover:text-text hover:bg-text/5 font-inter-medium'"
          >
            {{ page }}
          </button>
        }
      }
    </div>

    <!-- Botón Siguiente -->
    <button
      [disabled]="!meta()?.hasNextPage"
      (click)="goToPage(currentPage() + 1)"
      class="px-2 py-1 text-xs rounded text-text/60 hover:text-text hover:bg-text/5 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
      title="Página siguiente"
    >
      <i class="fas fa-angle-right"></i>
    </button>

    <!-- Botón Última página -->
    <button
      [disabled]="!meta()?.hasNextPage"
      (click)="goToPage(meta()?.totalPages || 1)"
      class="px-2 py-1 text-xs rounded text-text/60 hover:text-text hover:bg-text/5 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
      title="Última página"
    >
      <i class="fas fa-angle-double-right"></i>
    </button>
  </div>
</div>
